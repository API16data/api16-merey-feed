name: GFW port visits

on:
  schedule:
    - cron: "47 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gfw
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch tanker port visits at Venezuelan terminals (Global Fishing Watch)
        env:
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
        run: python tracker/gfw.py

      - name: Save results to the repository
        run: |
          git config user.name "api16-bot"
          git config user.email "api16-bot@users.noreply.github.com"
          git add tracker/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "GFW port visits $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; sleep $((i*5)); done
          exit 1
