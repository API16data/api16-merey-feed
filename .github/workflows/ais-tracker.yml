name: AIS tanker tracker

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ais-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install websockets==13.1

      - name: Listen to AIS for 45 minutes (near-continuous coverage, free on public repos)
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          LISTEN_SECONDS: "2700"
        run: python tracker/collect.py

      - name: Save results to the repository
        run: |
          git config user.name "api16-bot"
          git config user.email "api16-bot@users.noreply.github.com"
          git add tracker/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "AIS snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; sleep $((i*5)); done
          exit 1
