name: AIS tanker tracker

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}       # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: ais-tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install websockets==13.1

      - name: Listen to AIS for 10 minutes
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          LISTEN_SECONDS: "600"
        run: python tracker/collect.py

      - name: Save results to the repository
        run: |
          git config user.name "api16-tracker"
          git config user.email "api16-tracker@users.noreply.github.com"
          git add tracker/data
          git diff --cached --quiet || git commit -m "AIS snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
