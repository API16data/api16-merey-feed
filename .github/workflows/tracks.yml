name: GFW real routes

on:
  # runs every time the port-visit update finishes, so it always has the newest voyages
  workflow_run:
    workflows: ["GFW port visits"]
    types: [completed]
  workflow_dispatch:
    inputs:
      max:
        description: "New voyages to fetch in this run"
        required: false
        default: "100"

permissions:
  contents: write

concurrency:
  group: tracks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # the latest data, not the commit that queued this run

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Daily positions, encounters and AIS gaps per voyage (Global Fishing Watch)
        env:
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
          TRACK_MAX: ${{ inputs.max || '100' }}
        run: python tracker/tracks.py

      - name: Save results to the repository
        run: |
          git config user.name "api16-bot"
          git config user.email "api16-bot@users.noreply.github.com"
          git add tracker/data/tracks.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "GFW routes $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; sleep $((i*5)); done
          exit 1
